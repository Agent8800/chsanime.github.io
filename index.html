<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamIn - Movies & Series</title>
    <style>
        /* --- CSS Variables & Reset (White Theme) --- */
        :root {
            --bg-color: #ffffff;
            --card-bg: #1f2129;
            --text-primary: #111111;
            --text-secondary: #666666;
            --accent-color: #e50914;
            --telegram-blue: #24A1DE;
            --border-color: #e5e5e5;
            --button-black: #000000;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding-bottom: 80px;
        }

        /* --- Header / Navigation --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        /* Menu Toggle Styling */
        .menu-toggle {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }
        
        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: var(--text-primary);
            border-radius: 2px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-decoration: none;
        }
        .logo span { color: var(--accent-color); }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: var(--text-primary);
            opacity: 0.8;
            transition: var(--transition);
        }
        .nav-icon:hover { opacity: 1; transform: scale(1.1); }

        /* --- Slider Section --- */
        .slider-section {
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            border-radius: var(--border-radius);
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .slider-container {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            position: relative;
            aspect-ratio: 16/9;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        .slide-content {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 2;
        }

        .slide-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .slide-info {
            font-size: 0.9rem;
            color: #ddd;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-color);
            color: #333;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .slider-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }

        /* --- Main Content Grid --- */
        .container {
            padding: 10px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 768px) {
            .media-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* --- Same to Same Card Design (Overlay Title) --- */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: var(--transition);
            border: 1px solid transparent;
            aspect-ratio: 2/3; /* Vertical Poster Style */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
        }

        .card-poster {
            width: 100%;
            height: 100%;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .card:hover .card-poster img {
            transform: scale(1.05);
        }

        /* Overlay Design (Same to same as screenshot) */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px 15px 15px;
            /* Gradient to make text readable */
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
            display: flex;
            align-items: flex-end;
            height: 50%;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            width: 100%;
            line-height: 1.2;
        }

        /* --- View More Button Section --- */
        .view-more-section {
            text-align: center;
            margin: 50px 0;
            padding: 0 20px;
        }

        .view-more-btn {
            background-color: var(--button-black);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .view-more-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* --- Footer --- */
        footer {
            margin-top: 20px;
            padding: 60px 20px;
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer-content {
            max-width: 600px;
            margin: 0 auto;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background-color: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            text-decoration: none;
            border: 1px solid var(--border-color);
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: #333;
        }

        .social-icon:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .social-icon:hover svg { fill: white; }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--telegram-blue);
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 30px;
            width: 100%;
            max-width: 320px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(36, 161, 222, 0.2);
        }

        .telegram-btn:hover {
            background-color: #1b8dbf;
            box-shadow: 0 6px 20px rgba(36, 161, 222, 0.3);
            transform: translateY(-2px);
        }

        .telegram-btn svg {
            width: 22px;
            height: 22px;
            margin-right: 10px;
            fill: white;
        }

        .copyright {
            margin-top: 35px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        svg { display: block; }
    </style>
</head>
<body>

    <!-- Header / Navigation (Notification Removed) -->

        <div class="nav-icons">

            <svg class="nav-icon" viewBox="0 0 24 24">

            <div class="menu-toggle" onclick="alert('Menu Opened')">

                <span></span>

    </header>

    <!-- Hero Slider -->
    <div class="container">

            <div class="slider-container" id="sliderTrack">

                </div>

                        <div class="slide-info">See what's popular.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <!-- Updated Title -->
        <div class="section-title">
            Latest Anime
        </div>

        <div class="media-grid">
            
            <!-- 1. Fallout (Same to Same Overlay) -->
            <div class="card">
                <div class="card-poster">
                    <img src="https://picsum.photos/seed/fallout_wasteland/400/600" alt="Fallout">
                </div>
                <div class="card-overlay">
                    <div class="card-title">Fallout</div>

            <!-- 2. Stranger Things -->
            <div class="card">
                <div class="card-poster">

                </div>
                <div class="card-overlay">
                    <div class="card-title">Stranger Things</div>
                </div>
            </div>

            <!-- 3. Pluribus -->
            <div class="card">
                <div class="card-poster">

            <div class="card">

        </div>

        <!-- VIEW MORE BUTTON (Above Footer) -->
        <div class="view-more-section">
            <button class="view-more-btn" onclick="alert('Loading more posts...')">
                View More Posts
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
                    <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                </svg>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <!-- Social Icons -->
            <div class="social-links">
                <a href="#" class="social-icon" aria-label="Instagram">
                    <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8C4.6 22 2 19.4 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 18.39 5.61 20 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
                </a>
                <a href="#" class="social-icon" aria-label="Twitter">
                    <svg viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg>
                </a>
                <a href="#" class="social-icon" aria-label="Facebook">
                    <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                </a>
            </div>

            <!-- Telegram Button -->
            <a href="https://t.me/your_channel" target="_blank" class="telegram-btn">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.75-.33 1.4.19 1.16 1.28l-2.75 14.05c-.19.97-.74 1.13-1.43.71L12.6 17.3l-2.18 2.1c-.2.2-.37.37-.76.37l.28-4.23z"/></svg>
                Join Telegram Channel
            </a>

            <div class="copyright">
                &copy; 2024 StreamIn. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('sliderTrack');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const slides = document.querySelectorAll('.slide');
            let currentIndex = 0;
            const totalSlides = slides.length;

            function updateSlider() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % totalSlides;
                updateSlider();
            }

            function prevSlide() {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateSlider();
            }

            nextBtn.addEventListener('click', () => {
                nextSlide();
                resetAutoPlay();
            });

            prevBtn.addEventListener('click', () => {
                prevSlide();
                resetAutoPlay();
            });

            let autoPlay = setInterval(nextSlide, 5000); 

            function resetAutoPlay() {
                clearInterval(autoPlay);
                autoPlay = setInterval(nextSlide, 5000);
            }

            updateSlider();
        });
    </script>
</body>
</html>
